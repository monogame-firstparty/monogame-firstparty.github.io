<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #e0e0e0; background: #0d0d0d; margin: 0; padding: 40px 20px; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { color: #ffffff; font-size: 1.8em; margin-top: 0; }
  h2 { color: #cccccc; font-size: 1.3em; border-bottom: 1px solid #333; padding-bottom: 6px; margin-top: 2em; }
  a { color: #ffb84d; text-decoration: none; }
  a:hover { text-decoration: underline; }
  strong { color: #ffffff; }
  code { background: #1a1a1a; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
  ul { padding-left: 1.4em; }
  li { margin-bottom: 0.3em; }
</style>
</head>
<body>
<div class="container">
{{ content }}
</div>
</body>
</html>
